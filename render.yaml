services:
  # ┌─────────────────────────────────────────────────────────────────┐
  # │  WAXPREP AI TUTOR - MAIN WEBHOOK SERVER                       │
  # │  Handles WhatsApp webhooks, queues, and memory system         │
  # └─────────────────────────────────────────────────────────────────┘
  - type: web
    name: waxprep-webhook
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.11.0
      - key: REDIS_URL
        fromService:
          name: waxprep-redis
          type: redis
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: CUGA_SERVICE_URL
        sync: false
      - key: MODAL_ENDPOINT
        sync: false
      - key: MODAL_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: info

  # ┌─────────────────────────────────────────────────────────────────┐
  # │  CUGA AI BRAIN SERVICE                                         │
  # │  Python service that connects to Modal model and memory system │
  # └─────────────────────────────────────────────────────────────────┘
  - type: web
    name: waxprep-cuga
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MODAL_ENDPOINT
        sync: false
      - key: MODAL_TOKEN
        sync: false
      - key: MEMORY_API_URL
        sync: false

  # ┌─────────────────────────────────────────────────────────────────┐
  # │  REDIS DATABASE - Message Queues & Session Cache              │
  # └─────────────────────────────────────────────────────────────────┘
  - type: redis
    name: waxprep-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction
